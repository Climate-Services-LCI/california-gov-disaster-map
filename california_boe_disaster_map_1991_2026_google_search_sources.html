const map=L.map('map').setView([37.25,-119.5],6);
L.tileLayer('https://server.arcgisonline.com/ArcGIS/rest/services/Canvas/World_Light_Gray_Base/MapServer/tile/{z}/{y}/{x}',{maxZoom:16,attribution:'Tiles © Esri — Esri, TomTom, Garmin, FAO, NOAA, USGS, © OpenStreetMap contributors, and the GIS User Community'}).addTo(map);

const years=[...new Set(events.map(e=>e.year))].sort((a,b)=>b-a);
years.forEach(y=>{let o=document.createElement('option');o.value=y;o.textContent=y;document.getElementById('year').appendChild(o)});

const typeBuckets=[...new Set(events.map(e=>{
  const m=e.type.match(/^[A-Za-z]+/); return m?m[0]:'Other';
}))].sort();
typeBuckets.forEach(t=>{let o=document.createElement('option');o.value=t;o.textContent=t;document.getElementById('type').appendChild(o)});

function countyList(s){
  if(s==='All 58 counties') return all58.slice();
  if(s.startsWith('57 counties')) return all58.filter(x=>x!=='Del Norte');
  let out=[];
  const cities=s.match(/City of Rancho Cucamonga|City of Malibu|City of Rancho Palos Verdes|City of Oceanside|City of Carlsbad|City of Del Mar|City of San Diego|Cities of Grass Valley and Oakland/g)||[];
  const cityMap={
    'City of Rancho Cucamonga':'San Bernardino','City of Malibu':'Los Angeles','City of Rancho Palos Verdes':'Los Angeles',
    'City of Oceanside':'San Diego','City of Carlsbad':'San Diego','City of Del Mar':'San Diego',
    'City of San Diego':'San Diego','Cities of Grass Valley and Oakland':'Nevada, Alameda'
  };
  cities.forEach(c=>cityMap[c].split(',').forEach(x=>out.push(x.trim())));
  let cleaned=s.replace(/City of Rancho Cucamonga|City of Malibu|City of Rancho Palos Verdes|City of Oceanside|City of Carlsbad|City of Del Mar|City of San Diego|Cities of Grass Valley and Oakland/g,'');
  cleaned=cleaned.replace(/Los Angeles County/g,'Los Angeles');
  cleaned.split(',').map(x=>x.trim()).filter(Boolean).forEach(x=>{if(all58.includes(x))out.push(x)});
  return [...new Set(out)];
}
function matches(e){
  const y=document.getElementById('year').value;
  const t=document.getElementById('type').value;
  const q=document.getElementById('search').value.toLowerCase().trim();
  const type=(e.type.match(/^[A-Za-z]+/)||['Other'])[0];
  return (y==='all'||+y===e.year)&&(t==='all'||t===type)&&(!q||(e.type+' '+e.counties+' '+e.date).toLowerCase().includes(q));
}
function sourceLink(e){
  const q=[e.date,e.type,e.counties,"California","Governor","disaster","proclamation"].filter(Boolean).join(" ");
  const url="https://www.google.com/search?q="+encodeURIComponent(q);
  return `<a href="${url}" target="_blank" rel="noopener">Google search</a>`;
}

let layer;
function draw(){
  if(layer) map.removeLayer(layer);
  const selected=events.filter(matches);
  const counts={};
  all58.forEach(c=>counts[c]=0);
  selected.forEach(e=>countyList(e.counties).forEach(c=>{if(counts[c]!==undefined)counts[c]++}));
  const max=Math.max(1,...Object.values(counts));
  document.getElementById('count').textContent=`${selected.length} disaster-list entries selected`;
  function fill(n){
    if(!n)return '#eee';
    const q=n/max;
    return q>.75?'#7f0000':q>.5?'#b30000':q>.25?'#e34a33':'#fdbb84';
  }
  fetch('https://raw.githubusercontent.com/plotly/datasets/master/geojson-counties-fips.json')
  .then(r=>r.json()).then(gj=>{
    layer=L.geoJSON(gj,{
      filter:f=>f.properties.STATE==='06',
      style:f=>{const n=counts[f.properties.NAME]||0;return {weight:1,color:'#666',fillColor:fill(n),fillOpacity:.78}},
      onEachFeature:(f,l)=>{
        const county=f.properties.NAME;
        const rs=selected.filter(e=>countyList(e.counties).includes(county));
        l.bindTooltip(`<b>${county} County</b><br>${rs.length} selected disaster entries`,{sticky:true});
        l.on('click',()=>{
          const rows=rs.map(e=>`<tr><td>${e.date}</td><td>${e.type}</td><td>${sourceLink(e)}</td></tr>`).join('');
          L.popup({maxWidth:650}).setLatLng(l.getBounds().getCenter()).setContent(
            `<b>${county} County</b><br><span class="note">${rs.length} selected entries</span><br><br>`+
            `<table><tr><th>Date</th><th>Disaster</th><th>Source</th></tr>${rows||'<tr><td colspan="3">No selected entries.</td></tr>'}</table>`
          ).openOn(map);
        });
      }
    }).addTo(map);
  });
}
['year','type'].forEach(id=>document.getElementById(id).addEventListener('change',draw));
document.getElementById('search').addEventListener('input',draw);
draw();
